<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Грамотей">
<meta name="theme-color" content="#3f8f3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Грамотей</title>
<style>
:root{--sky1:#8fd3ff;--sky2:#e3f5ff;--panel:#fbf4e4;--panel2:#efe3c8;--ink:#2a1f14;--muted:#7a6a55;--grass:#5bb046;--grass2:#3f8f3a;--dirt:#8b5a2b;--ok:#2e9e44;--bad:#d64b3a;--gold:#f2b632;--line:#2a1f14;--acc:#3a7bd5}
body.th-cave{--sky1:#2f333d;--sky2:#596070}
body.th-snow{--sky1:#b9d7ee;--sky2:#ffffff}
body.th-sunset{--sky1:#ff9a62;--sky2:#ffe1a8}
body.th-night{--sky1:#101a3a;--sky2:#3a3f7a}
body.th-desert{--sky1:#f3c97a;--sky2:#fff2d0}
body.th-sea{--sky1:#2aa3c9;--sky2:#c9f1ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","SF Pro Text","Segoe UI",Roboto,sans-serif;color:var(--ink);background:linear-gradient(var(--sky1),var(--sky2) 60%);background-attachment:fixed;min-height:100dvh;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
#top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:var(--grass2);border-bottom:4px solid var(--dirt);color:#fff}
#top .lv{background:var(--gold);color:var(--ink);font-weight:900;border:3px solid var(--line);padding:2px 7px;font-size:14px;border-radius:3px}
#top .xpw{flex:1;min-width:50px}
#top .ttl{font-size:12px;font-weight:800;text-shadow:0 1px 0 rgba(0,0,0,.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:9px;background:rgba(0,0,0,.35);border:2px solid var(--line);border-radius:2px;overflow:hidden}
.bar>i{display:block;height:100%;background:#7ee35a}
.cur{display:flex;align-items:center;gap:3px;font-weight:900;font-size:15px;background:rgba(0,0,0,.25);padding:3px 7px;border-radius:3px}
#snd{background:none;border:0;font-size:18px;padding:2px;color:#fff}
#view{padding:12px 12px calc(96px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--dirt);border-top:4px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;background:none;border:0;color:#f3e2c4;padding:7px 0 8px;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
#tabs button b{font-size:22px;line-height:1.1}
#tabs button.on{color:#fff;background:rgba(255,255,255,.12)}
#tabs .dot{position:absolute;top:4px;right:calc(50% - 20px);background:var(--bad);color:#fff;font-size:10px;border-radius:8px;padding:0 5px;border:2px solid var(--line)}
.card{background:var(--panel);border:3px solid var(--line);border-radius:4px;box-shadow:inset -4px -4px 0 rgba(0,0,0,.08),inset 4px 4px 0 rgba(255,255,255,.7),0 3px 0 rgba(0,0,0,.25);padding:12px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:18px}
.card h3{margin:10px 0 6px;font-size:15px}
.muted{color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:#6fbf4a;color:#fff;font-weight:900;border:3px solid var(--line);border-radius:4px;padding:10px 14px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.25),inset 0 3px 0 rgba(255,255,255,.3);text-shadow:0 2px 0 rgba(0,0,0,.35);font-size:16px}
.btn:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.btn.blue{background:var(--acc)}.btn.gray{background:#9c9284}.btn.red{background:var(--bad)}.btn.gold{background:#e3a21a}.btn.purple{background:#8a5cd1}
.btn.wide{width:100%}.btn.sm{padding:6px 10px;font-size:14px}
.btn[disabled]{filter:grayscale(1);opacity:.55}
.row{display:flex;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gem{vertical-align:-3px}
.blk{vertical-align:-5px;border:1px solid rgba(0,0,0,.5);image-rendering:pixelated}
/* home */
.hero{display:flex;gap:12px;align-items:center}
.pet{font-size:46px;line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25));animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.bubble{position:relative;background:#fff;border:3px solid var(--line);border-radius:6px;padding:8px 10px;font-size:14px;font-weight:600;flex:1}
.bubble:before{content:"";position:absolute;left:-10px;top:16px;border:7px solid transparent;border-right-color:var(--line)}
.quest{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:2px dashed var(--panel2);font-size:14px}
.quest:last-child{border:0}
.quest .chk{width:22px;height:22px;border:3px solid var(--line);background:#fff;display:grid;place-items:center;font-size:14px;flex:none}
.quest.done .chk{background:var(--ok);color:#fff}
.quest .qb{flex:1}.quest .qn{font-weight:700}
.village{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:linear-gradient(#9be07a,#5bb046);border:3px solid var(--line);padding:8px 6px 6px;border-radius:4px;position:relative}
.plot{aspect-ratio:1;display:grid;place-items:center;font-size:30px;background:rgba(139,90,43,.25);border-radius:3px}
.plot.empty{font-size:14px;color:rgba(0,0,0,.35);border:2px dashed rgba(0,0,0,.25);background:none}
.streak{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.streak i{width:16px;height:16px;border:2px solid var(--line);background:#fff;display:block}
.streak i.on{background:var(--gold)}
/* worlds */
.wt{display:flex;gap:10px;align-items:center;padding:10px;margin-bottom:10px;width:100%;text-align:left;background:var(--panel)}
.wt .wi{font-size:34px;width:48px;height:48px;display:grid;place-items:center;background:var(--panel2);border:3px solid var(--line);flex:none}
.wt .wn{font-weight:900;font-size:16px}
.stars{color:#c9b98f;font-size:14px;letter-spacing:1px}.stars b{color:#e3a21a}
.badge{background:var(--bad);color:#fff;font-weight:800;font-size:12px;padding:1px 6px;border:2px solid var(--line);border-radius:10px}
.badge.g{background:var(--ok)}
/* craft & shop */
.res{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.res div{background:var(--panel2);border:2px solid var(--line);padding:5px 3px;text-align:center;font-weight:800;font-size:13px}
.rec{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:2px dashed var(--panel2)}
.rec:last-child{border:0}
.rec .ri{font-size:30px;width:46px;height:46px;display:grid;place-items:center;background:var(--panel2);border:3px solid var(--line);flex:none;position:relative}
.rec .ri small{position:absolute;right:-6px;bottom:-6px;background:var(--gold);border:2px solid var(--line);font-size:11px;font-weight:900;padding:0 4px}
.rec .rb{flex:1;min-width:0}.rec .rn{font-weight:900}.rec .rd{font-size:12px;color:var(--muted)}
.cost{font-size:13px;font-weight:800;margin-top:2px;display:flex;flex-wrap:wrap;gap:6px}
.cost span.no{color:var(--bad)}
.lock{opacity:.5}
.seg{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.seg button{flex:1;background:var(--panel2);border:3px solid var(--line);font-weight:800;padding:7px 4px;font-size:13px;border-radius:3px}
.seg button.on{background:var(--gold)}
/* stats */
.st{margin:6px 0}.st .l{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
.bar.big{height:14px;background:#e0d3b5}.bar.big>i{background:var(--ok)}
.bar.big>i.mid{background:var(--gold)}.bar.big>i.low{background:var(--bad)}
.ach{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ach div{background:var(--panel2);border:2px solid var(--line);text-align:center;padding:6px 2px;font-size:10px;font-weight:700;line-height:1.15}
.ach div b{display:block;font-size:24px;margin-bottom:2px}
.ach div.off{filter:grayscale(1);opacity:.4}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal i{aspect-ratio:1;border:2px solid var(--line);background:#fff;display:grid;place-items:center;font-size:10px;font-style:normal;font-weight:700}
.cal i.on{background:var(--grass)}.cal i.today{outline:3px solid var(--gold)}
/* overlay / task */
.ov{position:fixed;inset:0;z-index:20;background:var(--panel);display:flex;flex-direction:column}
.ov .oh{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;background:var(--grass2);color:#fff;border-bottom:4px solid var(--dirt)}
.ov .oh .x{background:rgba(0,0,0,.25);border:2px solid var(--line);color:#fff;font-weight:900;width:34px;height:34px;font-size:18px;border-radius:3px}
.ov .oh .pr{flex:1}
.ov .oh .ib{background:rgba(0,0,0,.25);border:2px solid var(--line);color:#fff;font-weight:800;height:34px;padding:0 8px;border-radius:3px;font-size:14px}
.ov .ob{flex:1;overflow-y:auto;padding:14px 12px 20px;max-width:560px;width:100%;margin:0 auto;-webkit-overflow-scrolling:touch}
.ov .of{padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:var(--panel2);border-top:3px solid var(--line)}
.pdots{display:flex;gap:3px}.pdots i{flex:1;height:10px;background:rgba(0,0,0,.3);border:2px solid var(--line)}
.pdots i.ok{background:#7ee35a}.pdots i.bad{background:var(--bad)}.pdots i.cur{background:#fff}
.tcat{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.prompt{font-size:17px;font-weight:800;margin:4px 0 14px}
.word{font-size:36px;font-weight:900;text-align:center;letter-spacing:1px;margin:14px 0 20px;word-break:break-word}
.gap{display:inline-block;min-width:.8em;border-bottom:4px solid var(--acc);color:var(--acc)}
.fill{color:var(--acc)}.fill.ok{color:var(--ok)}.fill.bad{color:var(--bad)}
.opts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.opt{min-width:84px;font-size:28px;font-weight:900;background:#fff;border:3px solid var(--line);border-radius:4px;padding:10px 16px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.12)}
.opt.w{font-size:20px;min-width:0;width:100%}
.opt.ok{background:#b8f0a4}.opt.bad{background:#f7b3a8}.opt.dim{opacity:.45}
.typed{min-height:56px;font-size:30px;font-weight:900;text-align:center;border:3px solid var(--line);background:#fff;padding:8px;border-radius:4px;letter-spacing:1px;word-break:break-word}
.typed.long{font-size:18px;text-align:left;min-height:110px;letter-spacing:0;line-height:1.5;font-weight:700}
.typed .caret{display:inline-block;width:3px;height:1em;background:var(--acc);vertical-align:-3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.say{display:flex;gap:10px;justify-content:center;margin:6px 0 14px}
.say .btn{font-size:22px}
.kb{display:flex;flex-direction:column;gap:5px;user-select:none}
.kb .kr{display:flex;gap:4px;justify-content:center}
.kb button{flex:1;max-width:40px;height:44px;background:#fff;border:2px solid var(--line);border-radius:4px;font-size:19px;font-weight:700;padding:0;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.kb button:active{background:var(--gold)}
.kb button.wide{max-width:none;flex:2;font-size:15px}
.kb button.ok{background:#6fbf4a;color:#fff;font-weight:900;flex:2.4;max-width:none;font-size:16px}
.kb button.sp{flex:5;max-width:none}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.tile{width:46px;height:52px;font-size:26px;font-weight:900;background:#fff;border:3px solid var(--line);border-radius:4px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.tile.used{visibility:hidden}
.zs{display:flex;flex-wrap:wrap;align-items:center;row-gap:10px;font-size:22px;font-weight:700;line-height:1.3;margin:10px 0 16px}
.zs .zg{width:24px;height:36px;border:0;background:none;padding:0;position:relative;font-size:28px;font-weight:900;color:var(--bad)}
.zs .zg:after{content:"";position:absolute;left:9px;bottom:2px;width:6px;height:6px;border-radius:50%;background:rgba(0,0,0,.18)}
.zs .zg.on:after{display:none}
.zs .zg.miss{background:#ffe08a;border-radius:4px}
.zs .zg.wrong{background:#f7b3a8;border-radius:4px}
.pt{background:#fff;border:3px solid var(--line);border-radius:4px;padding:10px;margin-bottom:10px}
.pt .ptl{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.pt .opts .opt{font-size:20px;min-width:0;flex:1}
.fb{border:3px solid var(--line);border-radius:4px;padding:12px;margin-top:16px;animation:pop .25s ease-out}
.fb.ok{background:#dcf6cf}.fb.bad{background:#fde3dd}
.fb .fbh{font-size:19px;font-weight:900;margin-bottom:6px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.rw{font-size:15px;background:rgba(255,255,255,.7);border:2px solid var(--line);padding:1px 7px;border-radius:3px;display:inline-flex;gap:4px;align-items:center}
.expl{background:#fffdf5;border:2px solid var(--line);border-left:8px solid var(--acc);padding:6px 10px;border-radius:3px;font-size:15px;line-height:1.45;margin:8px 0}
.expl p{margin:6px 0}
.expl .chk{font-weight:900;font-size:17px;background:#e8f1ff;padding:0 5px;border-radius:3px}
.expl .ans{font-weight:900;font-size:18px;background:#e2f7d8;padding:0 5px;border-radius:3px}
.expl .big{font-size:26px;font-weight:900;text-align:center;margin:6px 0}
.expl .tip{font-size:13px;color:var(--muted)}
b.st{color:var(--bad);text-decoration:underline}
b.trap{color:var(--acc);background:#e8f1ff;border-radius:3px;padding:0 1px}
.diff{font-size:22px;font-weight:900;letter-spacing:1px}
.diff .x{color:var(--bad);text-decoration:line-through}
.diff .m{color:var(--ok);background:#d8f5cc;border-radius:3px}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
.mt{font-size:20px;line-height:1.6;font-weight:600;background:#fff;border:3px solid var(--line);border-radius:4px;padding:12px}
.mt .w{border-radius:3px;padding:0 2px}
.mt .w.bad{background:#f7b3a8}.mt .w.miss{background:#ffe08a}.mt .w.ok{background:#d8f5cc}
.res-big{text-align:center}
.res-big .sc{font-size:54px;font-weight:900}
.res-big .str{font-size:40px;letter-spacing:4px}
.rwlist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.rwlist span{background:#fff;border:2px solid var(--line);padding:3px 8px;font-weight:900;border-radius:3px;display:inline-flex;gap:4px;align-items:center}
details.mis{background:#fff;border:2px solid var(--line);border-radius:3px;margin:6px 0;padding:6px 8px}
details.mis summary{font-weight:800;cursor:pointer}
/* modal & toasts */
#modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
#modal .sheet{background:var(--panel);border:3px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;width:100%;max-width:560px;max-height:88dvh;overflow:auto;padding:14px 14px calc(16px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#modal h2{margin:0 0 8px}
.rule p,.rule li{font-size:15px;line-height:1.5}
.rule .ex{background:#fffdf5;border:2px dashed var(--line);padding:6px 8px;border-radius:3px}
#toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 58px);z-index:60;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:#2a1f14;color:#fff;border:3px solid var(--gold);border-radius:6px;padding:8px 12px;font-weight:800;font-size:14px;max-width:92%;display:flex;gap:8px;align-items:center;animation:pop .25s ease-out;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.toast b{font-size:24px}
.confetti{position:fixed;top:-20px;width:12px;height:12px;z-index:70;pointer-events:none;animation:fall 1.6s linear forwards;border:1px solid rgba(0,0,0,.4)}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.lvlup{position:fixed;inset:0;z-index:65;display:grid;place-items:center;background:rgba(0,0,0,.5);animation:pop .3s}
.lvlup .card{text-align:center;max-width:320px}
.lvlup .big{font-size:60px}
.small{font-size:12px}
.mtop{margin-top:10px}
.center{text-align:center}
.flex1{flex:1}
.sbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;font-size:13px;font-weight:700}.sbar span{background:var(--panel2);border:2px solid var(--line);padding:2px 8px;border-radius:3px}.why{font-size:12px;background:#fff3c4;border:1px solid var(--line);border-radius:3px;padding:0 4px;font-weight:800}
.pill{display:inline-block;background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:1px 8px;font-size:12px;font-weight:800}
</style>
</head>
<body>
<header id="top"></header>
<main id="view"></main>
<nav id="tabs"></nav>
<div id="task" class="ov hidden"></div>
<div id="modal" class="hidden"></div>
<div id="toasts"></div>
<script>
"use strict";
/* ================= ДАННЫЕ ================= */
// Безударные гласные: [слово с пропуском, буква, проверочное (заглавная = ударная), сложность]
const BEZUD=[
['дв_ры','о','двОр',1],['тр_ва','а','трАвы',1],['з_мля','е','зЕмли',1],['р_ка','е','рЕки',1],['г_ра','о','гОры',1],
['с_ва','о','сОвы',1],['сл_ды','е','слЕд',1],['з_ма','и','зИмы',1],['гл_за','а','глАз',1],['сн_жок','е','снЕг',2],
['ст_на','е','стЕны',1],['д_ма','о','дОм',1],['л_сной','е','лЕс',2],['к_зёл','о','кОзы',2],['м_ря','о','мОре',2],
['р_ды','я','рЯд',2],['п_тно','я','пЯтна',2],['пл_сать','я','плЯска',2],['п_ла','и','пИлка',2],['д_жди','о','дОждь',2],
['ст_лы','о','стОл',1],['х_лмы','о','хОлм',1],['тр_пинка','о','трОпка',2],['з_лёный','е','зЕлень',2],['ж_лтеть','е','жЁлтый',3],
['с_стра','е','сЁстры',2],['зв_зда','е','звЁзды',2],['л_сток','и','лИст',1],['гр_бы','и','грИб',1],['ч_сы','а','чАс',1],
['кр_чать','и','крИк',2],['в_зать','я','вЯжет',3],['т_пло','е','тЁплый',2],['х_дить','о','хОдит',2],['л_мать','о','лОмкий',3],
['св_тить','е','свЕт',2],['в_сна','е','вЁсны',2],['ст_рик','а','стАрый',2],['с_ды','а','сАд',1],['д_ревья','е','дЕрево',2],
['гн_зда','е','гнЁзда',2],['кр_ты','о','крОт',1],['м_ста','е','мЕсто',1],['пл_ды','о','плОд',2],['к_ты','о','кОт',1],
['т_нул','о','тОнет',3],['ш_ги','а','шАг',1],['п_ля','о','пОле',1],['в_лна','о','вОлны',2],['с_ло','е','сЁла',2],
['к_сить','о','кОсит',3],['ч_стота','и','чИсто',3],['гр_за','о','грОзы',1],['б_жать','е','бЕг',2],['тр_сти','я','трЯска',3],
['пч_ла','е','пчЁлы',2],['ст_кло','е','стЁкла',2]
];

razd:{t:'Разделительные Ъ и Ь',h:`<p><b>Ъ</b> пишется <b>после приставки</b>, которая оканчивается на согласный, перед <b>е, ё, ю, я</b>: подъезд, объявление, съел.</p><p><b>Ь</b> пишется <b>внутри слова</b> (в корне или перед окончанием) перед <b>е, ё, ю, я, и</b>: вьюга, семья, ручьи, воробьи.</p><p class="ex">Есть приставка на согласный перед е, ё, ю, я? → <b>Ъ</b>. Нет → <b>Ь</b>.</p>`},
udv:{t:'Двойные согласные',h:`<p>Слова с двойными согласными в корне нужно <b>запомнить</b>: аллея, класс, касса, коллекция, программа, территория, аппетит, суббота.</p><p>Двойная согласная бывает и на стыке частей слова:</p><ul><li>приставка + корень: рас + сказ = ра<b>сс</b>каз</li><li>корень + суффикс: рус + ск + ий = ру<b>сс</b>кий</li></ul>`},
prist:{t:'Приставка или предлог',h:`<p><b>Приставка</b> — часть слова, пишется <b>слитно</b>: <b>до</b>бежал, <b>по</b>шёл.</p><p><b>Предлог</b> — отдельное слово, пишется <b>раздельно</b>: <b>до</b> речки, <b>по</b> тропинке.</p><ol><li>Между предлогом и словом можно вставить другое слово: по (узкой) тропинке.</li><li>Предлоги стоят перед словами-предметами, а приставки — внутри слов-действий.</li></ol>`},
zap:{t:'Запятые',h:`<p><b>Однородные члены</b> отвечают на один вопрос и относятся к одному слову.</p><ul><li>Без союзов — запятая: <i>Мы собирали грибы, ягоды, орехи.</i></li><li>Перед <b>а</b> и <b>но</b> — всегда запятая: <i>Не бежал, а шёл.</i></li><li>Одиночный <b>и</b> — запятая <b>не</b> нужна: <i>Ветер шумел и гнул деревья.</i></li></ul><p><b>Сложное предложение</b> — в нём две основы. Между частями ставим запятую, даже перед <b>и</b>: <i>Наступила осень, и птицы улетели.</i></p>`},
slovar:{t:'Словарные слова',h:`<p><b>Словарные слова</b> правилом не проверить — их написание нужно <b>запомнить</b>.</p><ul><li>Произнеси слово по слогам так, как оно пишется.</li><li>Найди трудную букву и запомни её.</li><li>Напиши слово и проверь по словарю.</li></ul><p class="ex">Сундук сам возвращает трудные слова через 1, 3, 7, 14 и 30 дней — так они запоминаются навсегда.</p>`},
dikt:{t:'Как писать диктант',h:`<ol><li>Дослушай слово до конца.</li><li>Найди «опасное место» — орфограмму.</li><li>Вспомни правило и проверь букву.</li><li>Напиши и прочитай слово по слогам.</li></ol><p class="ex">Можно нажать 🔊 ещё раз и послушать медленнее (🐢).</p>`},
pamyat:{t:'Письмо по памяти',h:`<p>Памятка из учебника:</p><ol><li>Прочитай текст. Пойми, о ком и о чём говорится.</li><li>Найди орфограммы. Подумай, как проверить их написание. Трудные слова проговори по слогам.</li><li>Обрати внимание на знаки препинания.</li><li>Ещё раз прочитай и представь, как пишется каждое слово.</li><li>Пиши, проговаривая по слогам. Потом проверь.</li></ol>`}
};

L.forEach((ch,i)=>{if('оаеияОАЕИЯ'.includes(ch)&&!p.st.has(i))cand.push({i,len:1,ans:ch,alt:{'о':'а','а':'о','е':'и','и':'е','я':'е','О':'А','А':'О','Е':'И','И':'Е','Я':'Е'}[ch]})});

 hint:`Измени слово так, чтобы после согласного шёл гласный. Например: «${ch}».`,

 const full=parts.map(p=>p.plain||(p.t==='p'?p.x+p.rest:p.x+' '+p.rest)).join(' ');
 const ex=parts.filter(p=>!p.plain).map(p=>p.t==='p'?`<p><b>${p.x}</b> в слове «${p.x}${p.rest}» — <b>приставка</b>, часть слова-действия. Приставки пишем <b>слитно</b>: <span class="ans">${p.x}${p.rest}</span></p>`:`<p><b>${p.x}</b> перед словом «${p.rest}» — <b>предлог</b>. Между ним и словом можно вставить другое слово: ${p.x} <i>(${p.f})</i> ${p.rest}. Предлоги пишем <b>раздельно</b>: <span class="ans">${p.x} ${p.rest}</span></p>`).join('');
 return{key,cat:c,parts,full,diff:2,hint:'Попробуй вставить слово между частями. Получилось — пиши раздельно.',expl:ex}}

 return{key,cat:c,toks:toks.map(t=>t.replace(/,$/,'')),zans:ans,full:s,diff:2,hint:'Найди однородные члены или две основы. Есть ли союзы а, но? Одиночное и?',expl:`<p>${e}</p><p class="ans" style="display:inline-block">${s}</p>`}}

 if(t.fmt==='choice'){const c=pick(d.cand.filter(x=>!x.dbl).length&&Math.random()<.75?d.cand.filter(x=>!x.dbl):d.cand);const L=[...d.plain];L.splice(c.i,c.len,'_');t.gap=L.join('');t.ans=c.ans;t.opts=[c.ans,c.alt];t.expl=dictExpl(d,c);t.hint=`Ударение: ${dictHtml(d)}`}
 if(t.fmt==='type'&&d.cand.length){const c=pick(d.cand);const L=[...d.plain];L.splice(c.i,c.len,'_');t.hint=`Трудное место: ${gapH(L.join(''))}`}
}
else{if(fmt==='type')t.hint=`Трудное место: ${gapH(b.gap)}`+(b.chk?` · проверь словом «${b.chk}»`:'');

function fmtFor(wid,lvl){const r=Math.random();const T={1:[1,0,0],2:[.7,.3,0],3:[.4,.4,.2],4:[.3,.4,.3],5:[.2,.4,.4]}[lvl]||[1,0,0];

 const fresh=shuffle(DICT.filter(d=>!S.sr[d.plain])).sort((a,b)=>(b.new4?1:0)-(a.new4?1:0)).map(d=>'dict:'+d.plain);

${S.inv.potion?`<button class="btn purple wide mtop" id="drink" ${S.boost?'disabled':''}>${S.boost?'🧪 Зелье уже действует':'🧪 Выпить зелье ума (×2 изумруды в следующем походе)'}</button>`:''}</div>
${st!=='open'?gateCard():`<div class="card"><h2>🛠️ Верстак</h2>${shopBar()}<div class="seg">${segs.map(([id,n])=>`<button data-s="${id}" class="${craftSeg===id?'on':''}">${n}</button>`).join('')}</div>
${ids.filter(filt).map(id=>{const it=ITEMS[id];const locked=lv<it.lv;const own=it.once&&S.inv[id];const pm=priceMult('it:'+id);const cost=costOf(id);const ok=!locked&&!own&&canPay(cost);

$('#view').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>craft(b.dataset.c));bindGate();

if(shopSeg==='village')body=`<div class="village" style="margin-bottom:10px">${BUILD.map(b=>S.build[b.id]?`<div class="plot">${b.i}</div>`:'<div class="plot empty">?</div>').join('')}</div>`+BUILD.map(b=>{const own=S.build[b.id];const pm=priceMult('b:'+b.id);const d=adj(b.d,pm.m),c=adjCost(b.cost,pm.m);const ok=S.dia>=d&&canPay(c);return `<div class="rec"><div class="ri">${b.i}</div><div class="rb"><div class="rn">${b.n}</div><div class="cost">${own?'✅ построено':`<span class="${S.dia<d?'no':''}">${DI} ${d}</span>${costHtml(c)}${whyH(pm.why)}`}</div></div>${own?'':`<button class="btn sm" data-bb="${b.id}" ${ok?'':'disabled'}>Строить</button>`}</div>`}).join('')+`<p class="muted small">Каждая постройка: +1 ${EM} в сундуке дня каждый день.</p>`;

if(shopSeg==='coll'){body=`<p class="muted">Собери 3 предмета серии и объедини их в <b>тотем</b>. Тотем открывает следующую серию. Пять тотемов объединяются в <b>${STAR.i} ${STAR.n}</b>.</p>`+COLL.map((t,k)=>{const done=S.totems[t.id];const open=collOpen(k);
 let h=`<h3>${t.i} ${t.n}${done?' ✅':''}</h3>`;if(!open)return h+`<p class="muted">🔒 Откроется, когда соберёшь «${COLL[k-1].n}».</p>`;if(done)return h+`<p class="muted">Тотем собран и стоит на витрине.</p>`;
 h+=t.parts.map(p=>{const own=S.coll[p[0]];const pr=P('col:'+p[0],t.price);return `<div class="rec"><div class="ri">${p[1]}</div><div class="rb"><div class="rn">${p[2]}</div><div class="cost">${own?'✅ есть':`${EM} ${pr.v}${pr.w}`}</div></div>${own?'':`<button class="btn sm" data-cb="${p[0]}" data-t="${t.id}" ${S.em>=pr.v?'':'disabled'}>Купить</button>`}</div>`}).join('');
 const all=t.parts.every(p=>S.coll[p[0]]);const pm=priceMult('fuse:'+t.id);const d=adj(t.dia,pm.m),c=adjCost(t.res,pm.m);
 return h+`<div class="rec"><div class="ri">${t.i}</div><div class="rb"><div class="rn">Объединить в ${t.n}</div><div class="rd">${t.parts.map(p=>p[1]).join(' + ')} = ${t.i}</div><div class="cost"><span class="${S.dia<d?'no':''}">${DI} ${d}</span>${costHtml(c)}${whyH(pm.why)}</div></div><button class="btn sm purple" data-fu="${t.id}" ${all&&S.dia>=d&&canPay(c)?'':'disabled'}>Объединить</button></div>`}).join('')+
 (()=>{const allT=COLL.every(t=>S.totems[t.id]);const pm=priceMult('fuse:star');const d=adj(STAR.dia,pm.m),c=adjCost(STAR.res,pm.m);return `<h3>${STAR.i} ${STAR.n}${S.star?' ✅':''}</h3>`+(S.star?'<p class="muted">Главный трофей собран! Ты настоящий Мастер слова.</p>':`<div class="rec"><div class="ri">${STAR.i}</div><div class="rb"><div class="rn">${COLL.map(t=>S.totems[t.id]?t.i:'▫️').join(' ')}</div><div class="cost"><span class="${S.dia<d?'no':''}">${DI} ${d}</span>${costHtml(c)}${whyH(pm.why)}</div></div><button class="btn sm gold" id="starb" ${allT&&S.dia>=d&&canPay(c)?'':'disabled'}>Создать</button></div>`)})()}
if(shopSeg==='luck'){const pr=P('luck',LUCK);body=`<div class="center"><div style="font-size:70px">🎁</div><p><b>Сундук удачи</b> — внутри изумруды, ресурсы, а иногда факелы, щит, зелье или предмет для тотема!</p><button class="btn gold" id="luck" ${S.dia>=pr.v?'':'disabled'}>Открыть за ${pr.v} ${DI}</button><div class="mtop">${pr.w}</div></div>`}
if(shopSeg==='trade'){const ex=P('exch',EXCH);body=`<div class="rec"><div class="ri">${DI}</div><div class="rb"><div class="rn">1 алмаз</div><div class="cost">${EM} ${ex.v}${ex.w}</div></div><button class="btn sm" id="buyd" ${S.em>=ex.v?'':'disabled'}>Обменять</button></div>`+Object.keys(RES).map(k=>{const pr=P('res:'+k,RES[k].p);return `<div class="rec"><div class="ri">${blk(k,30)}</div><div class="rb"><div class="rn">${RES[k].n}</div><div class="cost">${EM} ${pr.v}${pr.w}</div></div><button class="btn sm" data-r="${k}" ${S.em>=pr.v?'':'disabled'}>Купить</button></div>`}).join('')}
$('#view').innerHTML=st!=='open'?gateCard():`<div class="card"><h2>💎 Лавка</h2>${shopBar()}<div class="seg">${segs.map(([id,n])=>`<button data-s="${id}" class="${shopSeg===id?'on':''}">${n}</button>`).join('')}</div>${body}${LEGEND}</div>`;

V.querySelectorAll('[data-bb]').forEach(b=>b.onclick=()=>{const x=BUILD.find(y=>y.id===b.dataset.bb);const pm=priceMult('b:'+x.id);const d=adj(x.d,pm.m),c=adjCost(x.cost,pm.m);if(!ok()||S.dia<d||!canPay(c))return;useAction('b:'+x.id);pay(c);spend(d);S.build[x.id]=today();SFX.lvl();confetti();levelUp('Построено!',x.n,x.i,`+1 ${EM} в сундуке дня`)});
V.querySelectorAll('[data-tb]').forEach(b=>b.onclick=()=>{const x=THEMES.find(y=>y.id===b.dataset.tb);const v=P('th:'+x.id,x.cost).v;if(!ok()||S.dia<v)return;useAction('th:'+x.id);S.themes.push(x.id);S.theme=x.id;SFX.coin();spend(v)});
V.querySelectorAll('[data-ta]').forEach(b=>b.onclick=()=>{S.theme=b.dataset.ta;done()});

const bd=$('#buyd');if(bd)bd.onclick=()=>{const v=P('exch',EXCH).v;if(!ok()||S.em<v)return;useAction('exch');S.em-=v;S.dia++;SFX.coin();done()};
V.querySelectorAll('[data-cb]').forEach(b=>b.onclick=()=>{const t=COLL.find(x=>x.id===b.dataset.t);const id=b.dataset.cb;const v=P('col:'+id,t.price).v;if(S.coll[id]||S.em<v)return;useAction('col:'+id);S.em-=v;S.coll[id]=1;const p=t.parts.find(x=>x[0]===id);SFX.coin();toast(p[1],`${p[2]} — в коллекции!`);done()});
V.querySelectorAll('[data-fu]').forEach(b=>b.onclick=()=>{const t=COLL.find(x=>x.id===b.dataset.fu);const pm=priceMult('fuse:'+t.id);const d=adj(t.dia,pm.m),c=adjCost(t.res,pm.m);if(S.totems[t.id]||!t.parts.every(p=>S.coll[p[0]])||S.dia<d||!canPay(c))return;useAction('fuse:'+t.id);pay(c);t.parts.forEach(p=>delete S.coll[p[0]]);S.totems[t.id]=today();spend(d);confetti();levelUp('Тотем собран!',t.n,t.i,t.parts.map(p=>p[1]).join(' + ')+' = '+t.i+(COLL[COLL.indexOf(t)+1]?`<br>Открыта новая серия: ${COLL[COLL.indexOf(t)+1].n}`:''))});
const sb=$('#starb');if(sb)sb.onclick=()=>{const pm=priceMult('fuse:star');const d=adj(STAR.dia,pm.m),c=adjCost(STAR.res,pm.m);if(S.star||!COLL.every(t=>S.totems[t.id])||S.dia<d||!canPay(c))return;useAction('fuse:star');pay(c);S.star=true;spend(d);confetti();setTimeout(confetti,600);levelUp('Звезда Мастера слова!','Главный трофей Грамотея',STAR.i,'Пять тотемов объединились в звезду!')};
const lk=$('#luck');if(lk)lk.onclick=()=>{const v=P('luck',LUCK).v;if(!ok()||S.dia<v)return;useAction('luck');openLuck(v)};
function done(){checkAch();save();render()}}
function spend(n){S.dia-=n;S.cnt.spent+=n;checkAch();save();render()}
function openLuck(v){spend(v);const r=Math.random();let txt,ico='🎁';
if(r<.07){S.inv.potion=(S.inv.potion||0)+1;txt='Зелье ума!';ico='🧪'}else if(r<.17){S.inv.shield=(S.inv.shield||0)+1;txt='Щит!';ico='🛡️'}else if(r<.32){S.inv.torch=(S.inv.torch||0)+2;txt='2 факела!';ico='🔥'}
else if(r<.38){S.dia+=3;txt=`Тройной алмаз: +3 ${DI}!`;ico='💎'}
else if(r<.50&&randomPart()){const p=randomPart();S.coll[p[0]]=1;txt=`Предмет для тотема: ${p[2]}!`;ico=p[1]}
else{const em=8+rnd(14);S.em+=em;const got={};for(let i=0;i<3;i++){const k=pick(['wood','stone','paper','coal','iron','gold','crystal']);got[k]=(got[k]||0)+1;addRes(k)}txt=`+${em} ${EM} `+Object.entries(got).map(([k,v])=>blk(k,16)+v).join(' ')}

modal(`<div class="rule"><h2>📖 ${r.t}</h2>${bonus}${r.h}</div><button class="btn wide mtop" id="cm">Понятно</button>`);$('#cm').onclick=closeModal}
function showRules(){modal(`<h2>📖 Правила</h2>${Object.entries(RULES).map(([id,r])=>`<button class="btn wide gray" style="margin-bottom:6px;justify-content:flex-start" data-r="${id}">${S.readRules[id]?'✅':'📘'} ${r.t}</button>`).join('')}`);
document.querySelectorAll('#modal [data-r]').forEach(b=>b.onclick=()=>showRule(b.dataset.r))}
function showSettings(){modal(`<h2>⚙️ Настройки</h2><button class="btn wide gray" id="s1">${S.sound?'🔇 Выключить звук':'🔊 Включить звук'}</button><div style="height:8px"></div>
<button class="btn wide blue" id="tts">🗣 Проверить голос диктанта</button><p class="muted small">${hasTTS?(ruVoice?'Голос: '+esc(ruVoice.name):'Русский голос не найден — будет голос по умолчанию.'):'Этот браузер не умеет читать вслух.'} Если не слышно — проверьте, что на iPhone выключен беззвучный режим.</p>
<div style="height:8px"></div><button class="btn wide red" id="rst">Сбросить весь прогресс</button><p class="muted small">Прогресс хранится только на этом телефоне.</p>`);
$('#s1').onclick=()=>{S.sound=!S.sound;save();renderTop();showSettings()};$('#tts').onclick=()=>speak('Привет! Начинаем диктант. Вокзал. Пассажир.');
$('#rst').onclick=()=>{modal(`<h2>Точно сбросить?</h2><p>Пропадут уровни, алмазы, предметы и достижения.</p><div class="row"><button class="btn gray flex1" id="no">Нет</button><button class="btn red flex1" id="yes">Сбросить</button></div>`);$('#no').onclick=closeModal;$('#yes').onclick=()=>{S=merge(DEF,null);save();closeModal();render()}}}
function toast(ico,txt){const T=$('#toasts');while(T.children.length>=3)T.firstChild.remove();const d=document.createElement('div');d.className='toast';d.innerHTML=`<b>${ico}</b><span>${txt}</span>`;T.appendChild(d);setTimeout(()=>d.remove(),2600)}
function levelUp(h,sub,ico,extra){const d=document.createElement('div');d.className='lvlup';d.innerHTML=`<div class="card"><div class="big">${ico}</div><h2>${h}</h2><p style="font-weight:800">${sub}</p><p>${extra||''}</p><button class="btn wide">Ура!</button></div>`;document.body.appendChild(d);d.querySelector('button').onclick=()=>{d.remove();render()};SFX.lvl()}
function confetti(){const cols=['#5bb046','#ffd84a','#5ff0e8','#e2b996','#a0703f','#d64b3a'];for(let i=0;i<28;i++){const c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=pick(cols);c.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),2300)}}

/* ============ СТАРТ ============ */
if(!S.first){S.first=today();save()}
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
